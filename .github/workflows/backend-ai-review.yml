name: Backend AI Review (Gemini + Telegram)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get PR Metadata
        id: prinfo
        run: |
          echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT

      - name: Fetch PR Diff
        run: |
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "${{ github.event.pull_request.diff_url }}" \
          -o pr.diff

          # Limit diff size (Gemini token safety)
          head -c 15000 pr.diff > pr_limited.diff

      - name: Send Diff to Gemini
        id: gemini
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -d @- <<EOF
          {
            "contents": [{
              "parts": [{
                "text": "You are a senior backend architect reviewing a Node.js + Express + Prisma + TypeScript backend.

Focus on:

SECURITY:
- JWT misuse
- Missing auth middleware
- Prisma injection risks
- Missing validation
- Rate limiting bypass
- Sensitive env exposure

PERFORMANCE:
- N+1 queries
- Blocking sync code
- Redis misuse

ARCHITECTURE:
- Controller/service separation
- AppError usage
- Logging consistency
- Middleware order

CODE QUALITY:
- Type safety
- Async/await mistakes
- Unhandled rejections

Return:
1. 🔴 Critical Issues
2. 🟠 Improvements
3. 🟢 Good Practices
4. Overall Risk Level (Low/Medium/High)

Here is the PR diff:

$(cat pr_limited.diff)"
              }]
            }]
          }
EOF
          )

          echo "$RESPONSE" > response.json
          COMMENT=$(jq -r '.candidates[0].content.parts[0].text' response.json)

          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Comment on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🤖 AI Backend Review

            ${{ steps.gemini.outputs.comment }}

      - name: Send Notification to Telegram
        run: |
          SUMMARY=$(echo "${{ steps.gemini.outputs.comment }}" | head -c 3500)

          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{
                \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
                \"text\": \"🚀 *New Backend PR Review*

Title: ${{ steps.prinfo.outputs.title }}
Author: ${{ steps.prinfo.outputs.author }}
Branch: ${{ steps.prinfo.outputs.branch }}

Review Summary:

$SUMMARY

🔗 ${{ steps.prinfo.outputs.url }}\",
                \"parse_mode\": \"Markdown\"
              }"
