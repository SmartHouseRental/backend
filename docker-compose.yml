services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart-rental-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-house_rental}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}' ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-rental-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-rental-backend
    ports:
      - '${PORT:-5000}:${PORT:-5000}'
    environment:
      PORT: ${PORT:-5000}
      NODE_ENV: ${NODE_ENV:-production}
      # DATABASE_URL from .env takes priority (Neon cloud DB).
      # Remove DATABASE_URL from .env to use the local Docker postgres container instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-house_rental}}
      DIRECT_URL: ${DIRECT_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-house_rental}}

      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      GOOGLE_EMAIL_USER: ${GOOGLE_EMAIL_USER}
      GOOGLE_EMAIL_PASS: ${GOOGLE_EMAIL_PASS}

      CLOUDINARY_API_KEY: 834196869572432
      CLOUDINARY_API_SECRET: she14Ox3FZStR3kSpm8sTMJcwKk
      CLOUDINARY_CLOUD_NAME: dbwxpsplw
      CLOUDINARY_URL: cloudinary://671985636631885:ABLfgvTa95HSwImQd7T-gR6kYc8@dkqthvuy2
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      CHAPA_ENCRIPTION_KEY: 2PX7AUpEGyZEnJ0USYubh9gf
      CHAPA_PUBLICK_KEY: CHAPUBK_TEST-aNhkNQ0MjV7EIH5ctTrqWyBGne9oPoe4
      CHAPA_SECRET_KEY: CHASECK_TEST-RWIk0EmZvRVdmAnNOpGodkvRyFnbP1FS
      GEMINI_API_KEY: AIzaSyBFCveS8vWBgABTLquruR_E3-Nyhrx5Jfk
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embedding-service:8000}
      APP_BASE_URL: ${APP_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_started
    restart: unless-stopped

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: smart-rental-bge
    ports:
      - '${EMBEDDING_PORT:-3002}:3002'
    restart: unless-stopped

  recommendation-db:
    image: postgres:16-alpine
    container_name: smart-rental-rec-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recommendations
    ports:
      - '5433:5432'
    volumes:
      - rec_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 5

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: smart-rental-recommendations
    ports:
      - '${RECOMMENDATION_PORT:-3001}:3001'
    environment:
      MAIN_DB_URL: postgresql://postgres:postgres@postgres:5432/${POSTGRES_DB:-house_rental}
      RECOMMENDATION_DB_URL: postgresql://postgres:postgres@recommendation-db:5432/recommendations
      REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      recommendation-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rec_db_data:
